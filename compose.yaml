services:
  quote-management:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/actuator/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
